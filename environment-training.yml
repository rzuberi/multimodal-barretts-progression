# TRAINING / MODEL-PROVENANCE environment.
#
# This mirrors the cluster `virchow2` environment (Python 3.10.19), which is the
# environment that PRODUCED the frozen Chapter 1 model checkpoints under
#   analysis/chapter1_lgd2_final_pre_event_20260713_final/
# The per-fold model.joblib pipelines were pickled with scikit-learn 1.7.2;
# loading them under a different scikit-learn minor version raises
# InconsistentVersionWarning and is not guaranteed to reproduce predictions.
#
# Use THIS env when you need to re-load, re-train, or re-run inference on the
# frozen model checkpoints. For pure analysis/figure regeneration from the
# summary CSVs (no model loading), the lighter analysis env in environment.yml
# (mirroring `erin`) is sufficient.
#
# Create with:
#   conda env create -f environment-training.yml
#   conda activate barretts-ch1-training
#
# On the cluster the existing env is used directly:
#   conda activate virchow2   # /home/zuberi01/miniforge3/envs/virchow2
#
# GPU note: torch below is the CUDA build present in `virchow2` (torch 2.9.1,
# cu128). For a fresh install prefer the official pytorch selector for your CUDA.
name: barretts-ch1-training
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy=2.2.6
  - pandas=2.3.3
  - scipy=1.15.3
  - scikit-learn=1.7.2
  - pyyaml=6.0.3
  - pillow=12.1.0
  - matplotlib=3.10.9
  - h5py=3.16.0
  - threadpoolctl=3.6.0
  - pip:
      - torch==2.9.1
      - torchvision==0.24.1
      - timm==1.0.24
